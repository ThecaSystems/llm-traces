name: CI

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    name: Lint, Test & Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build:standalone

      - name: Verify attribution in bundle
        run: test -f dist/LICENSE && test -f dist/NOTICE

      - name: Verify plugin version match
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          PLUGIN_VERSION=$(node -p "require('./plugin.json').info.version")
          if [ "$PKG_VERSION" != "$PLUGIN_VERSION" ]; then
            echo "::error::Version mismatch: package.json=$PKG_VERSION plugin.json=$PLUGIN_VERSION"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-dist
          path: dist/
          retention-days: 14

  e2e:
    name: E2E Tests
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - uses: actions/download-artifact@v4
        with:
          name: plugin-dist
          path: dist/

      - name: Start Grafana
        run: |
          docker run -d --name grafana \
            -p 3000:3000 \
            -e GF_AUTH_ANONYMOUS_ENABLED=true \
            -e GF_AUTH_ANONYMOUS_ORG_ROLE=Admin \
            -e GF_DEFAULT_APP_MODE=development \
            -e GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=llm-traces-app \
            grafana/grafana-oss:12.0.0
          docker cp dist/. grafana:/var/lib/grafana/plugins/llm-traces-app/
          docker cp provisioning/plugins/. grafana:/etc/grafana/provisioning/plugins/
          docker cp provisioning/datasources/tempo.yaml grafana:/etc/grafana/provisioning/datasources/tempo.yaml
          docker restart grafana
          # Wait for Grafana to be ready
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "Grafana is ready"
              break
            fi
            sleep 2
          done

      - name: Run E2E tests
        run: npx playwright test --reporter=list
        env:
          GRAFANA_URL: http://localhost:3000

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Stop Grafana
        if: always()
        run: docker rm -f grafana
